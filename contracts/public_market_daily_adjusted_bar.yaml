contract: public.market_daily_adjusted_bar
version: 1
description: 指定factor_set_id的HFQ派生行情View。Raw行情×累计因子，HFQ由Base计算，Strategy不自行复权。
type: view
grain: [symbol, date, factor_set_id]
consumer_contract: 必须 WHERE factor_set_id=<uuid> 固定复权版本；日期范围不保证同版本。
columns:
  - {name: symbol,           type: TEXT,    nullable: false, semantic: 完整身份}
  - {name: date,             type: INTEGER, nullable: false, semantic: 交易日YYYYMMDD}
  - {name: market_source_id, type: TEXT,    nullable: false, semantic: 行情来源}
  - {name: factor_set_id,    type: UUID,    nullable: false, semantic: 复权因子版本身份}
  - {name: open,             type: NUMERIC, nullable: false, semantic: Raw开盘(执行)}
  - {name: high,             type: NUMERIC, nullable: false, semantic: Raw最高}
  - {name: low,              type: NUMERIC, nullable: false, semantic: Raw最低}
  - {name: close,            type: NUMERIC, nullable: false, semantic: Raw收盘(盯市mark_price)}
  - {name: volume,           type: NUMERIC, nullable: false, semantic: 原始成交量不复权}
  - {name: amount,           type: NUMERIC, nullable: false, semantic: 原始成交额}
  - {name: open_hfq,         type: DOUBLE,  nullable: true,  semantic: Raw open×factor_cum}
  - {name: high_hfq,         type: DOUBLE,  nullable: true,  semantic: Raw high×factor_cum}
  - {name: low_hfq,          type: DOUBLE,  nullable: true,  semantic: Raw low×factor_cum}
  - {name: close_hfq,        type: DOUBLE,  nullable: true,  semantic: Raw close×factor_cum(仅研究/信号)}
  - {name: factor_cum,       type: DOUBLE,  nullable: false, semantic: 当日累计复权因子}
scope: 仅asset_family=equity；指数/ETF不写factor_cum=1伪记录，不在本View内。
validation:
  - v1 factor set: 15,655,244行/5970股/2008-01-02..2026-11-10
  - HFQ价格抽样10000行与hfq_daily mismatch=0
  - 累计因子全量与hfq_daily.factor_cum mismatch=0
