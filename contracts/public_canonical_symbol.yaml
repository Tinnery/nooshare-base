contract: public.canonical_symbol
version: 3
description: 全矩阵唯一证券标识 hub（P1）— 方案 A 覆盖全资产 10887 行
primary_key: [exchange, canonical_id]
columns:
  - {name: canonical_id, type: TEXT,        nullable: false, semantic: 纯数字本地代码（如 000001），与 exchange 组成复合身份}
  - {name: exchange,     type: TEXT,        nullable: false, semantic: "交易所：sh / sz / bj（tong.symbol_meta.symbol 前缀）"}
  - {name: code,         type: TEXT,        nullable: false, semantic: 纯数字代码（ju 风格）}
  - {name: symbol,       type: TEXT,        nullable: false, semantic: 带交易所前缀（tong 风格，如 sz000001）}
  - {name: asset_class,  type: TEXT,        nullable: false, semantic: "证券分类（stock/index/etf，由 tong.symbol_meta.class 映射：bstock→stock, block→index）"}
  - {name: list_date,    type: DATE,        nullable: true,  semantic: 上市日}
  - {name: delist_date,  type: DATE,        nullable: true,  semantic: 退市日（在市为 NULL）}
  - {name: created_at,   type: TIMESTAMPTZ, nullable: false, semantic: 创建时间（DEFAULT now()）}
  - {name: updated_at,   type: TIMESTAMPTZ, nullable: false, semantic: 更新时间（DEFAULT now()）}
constraints:
  - "PRIMARY KEY (exchange, canonical_id) — 2026-11-27 方案 A：允许 sh000001(index) 与 sz000001(stock) 共存"
  - "同 asset_class 内 code 唯一（stock/etf/index 各自无跨 exchange 重复）"
  - "canonical_id ↔ (tong.symbol_meta, ju.stocks) 映射无歧义（V12）"
indexes:
  - "idx_canonical_symbol_symbol ON (symbol)"
slo:
  completeness: 覆盖 tong.symbol_meta 与 ju.stocks 全部证券，对交易所官方列表计数差异 = 0（V4）
  consistency: tong.symbol ↔ ju.stock_code 映射差异全部进 reconcile 台账（V12）
source_tables: [tong.symbol_meta, ju.stocks, ju.indices, ju.funds]
consumers: [downstream indicators module, all public.* views]
