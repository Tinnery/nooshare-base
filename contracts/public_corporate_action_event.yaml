contract: public.corporate_action_event
version: 1
description: 公司行为事件溯源表（P2）
primary_key: [event_id]
columns:
  - {name: event_id,       type: TEXT,        nullable: false, semantic: 事件唯一标识（UUID）}
  - {name: canonical_id,   type: TEXT,        nullable: false, semantic: 关联 canonical_symbol.canonical_id}
  - {name: event_type,     type: TEXT,        nullable: false, semantic: "事件类型：st_mark / st_remove / dividend / split / shares_change"}
  - {name: effective_date, type: DATE,        nullable: false, semantic: 生效日期（除权除息日、ST 变更日等）}
  - {name: pub_date,       type: DATE,        nullable: true,  semantic: 公告日期（当前源数据缺失，全部为 NULL）}
  - {name: observed_at,    type: TIMESTAMPTZ, nullable: false, semantic: 观测时间（DEFAULT now()）}
  - {name: payload,        type: JSONB,       nullable: true,  semantic: 事件详情（JSON，结构因 event_type 而异）}
  - {name: source_id,      type: TEXT,        nullable: true,  semantic: 来源标识}
  - {name: created_at,     type: TIMESTAMPTZ, nullable: false, semantic: 创建时间（DEFAULT now()）}
constraints:
  - "PRIMARY KEY (event_id)"
  - "FOREIGN KEY (canonical_id) REFERENCES canonical_symbol(canonical_id)"
  - "UNIQUE (canonical_id, event_type, effective_date, source_id) — 幂等键"
indexes:
  - "idx_corporate_action_event_canonical ON (canonical_id, effective_date)"
payload_schema:
  st_mark:     "{st_type: 'ST' | '*ST' | 'S*ST'}"
  st_remove:   "{st_type: 'ST' | '*ST' | 'S*ST'}"
  dividend:    "{per_10shares: float, bonus_ratio: float}"
  split:       "{ratio: float}"
  shares_change: "{total_shares: int, circulating_shares: int}"
source_tables: [ju.st_period, tong.gbbq]
consumers: [public.st_status_pit, public.adjustment_factor_pit, downstream indicators module]
