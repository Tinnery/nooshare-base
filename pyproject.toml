[project]
name = "nooshare-base"
version = "0.1.0"
description = "Point-in-time correct base data product layer for the nooshare matrix"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "ruamel.yaml>=0.18",
    "pytz>=2024.1",
    "flask>=3.0",
]

[project.scripts]
base = "base.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["base"]

[tool.pytest.ini_options]
testpaths = ["tests"]
