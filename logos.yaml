schema_version: 2

# nooshare-base 的知识索引（repo 级）。
#
# 原则：
#   1. 权威只持一份 —— 系统职责与跨仓边界以 nooshare-design 为 normative 权威，本 repo 只引用，不复制。
#   2. 本 repo 的 normative 权威是 contracts/（数据产品契约）与 AGENTS.md（铁律）。
#   3. 公共仓库禁止文档目录与文字材料；需求、数据字典、CLI 参考、使用示例等已迁出到
#      nooshare-design/implementation-docs/nooshare-base/，本 repo 只通过 AGENTS.md 索引。
#   4. 上游结构关系与坑清单见 nooshare-design/data-flow/。

project:
  name: nooshare-base
  description: nooshare 矩阵的基础数据产品层 —— 将 namespace 原始数据加工为 point-in-time 正确的 public.* 数据产品。
  scope: 只读源 namespaces（ju/tong/finance/capital），只写 public.*；不采集、不算指标、不做分析。
  position: nooshare-design/architecture/matrix.md 定义的「标准化数据基础」实现仓库。

resources:
  # ── 治理层 ──
  - path: AGENTS.md
    kind: agent-rules
    status: current
    authority: normative
    read_when: Agent 会话进入本 repo 时首先装载；权威路由、五条铁律与公共仓库文档禁令。
  - path: README.md
    kind: repo-governance
    status: current
    authority: normative
    read_when: 首次接触本 repo；需要一句话定位时。

  # ── 控制层（契约冻结）──
  - path: contracts/
    kind: schema-contracts
    status: current
    authority: normative
    read_when: 修改任何表结构前；下游编写查询前；上游疑似变更后。public_* 为本 repo 产出契约，ju/tong/finance 为上游消费契约。

  # ── 外部文字材料（唯一归属 nooshare-design）──
  - path: nooshare-design/implementation-docs/nooshare-base/
    repo: nooshare-design
    kind: text-materials
    status: current
    authority: normative
    read_when: 需要需求说明书、数据字典、API 参考、使用示例、契约目录说明或文档索引时；先按 workspace.yaml 定位 nooshare-design checkout。
  - path: nooshare-design/data-flow/matrix-data-flow.md
    repo: nooshare-design
    kind: upstream-linkage
    status: current
    authority: normative
    read_when: 新会话首次进入本 repo；评估上游结构变更影响时。
  - path: nooshare-design/data-flow/upstream-pitfalls.md
    repo: nooshare-design
    kind: upstream-pitfalls
    status: current
    authority: normative
    read_when: 调试列名/类型错误；排查上游数据坑时。

  # ── 关键代码入口（DDL 与管线的事实来源）──
  - path: base/db.py
    kind: ddl-entry
    status: current
    authority: factual-reference
    read_when: 修改 public.* 表结构或物化视图定义时。注意：DDL inline 于 init_schema()，本 repo 无 migrations/ 目录。
  - path: base/pipeline/runner.py
    kind: pipeline-entry
    status: current
    authority: factual-reference
    read_when: 理解 P1-P7 执行顺序、幂等记录（pipeline_run）时。
  - path: scripts/generate_docs.py
    kind: docs-generator
    status: current
    authority: factual-reference
    read_when: 契约变更后需要重新生成文字材料时；默认写入被忽略的 .generated/，正式版本输出到 nooshare-design/implementation-docs/nooshare-base/。
